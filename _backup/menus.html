<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station LTD - Menus & Formules</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/menus.css">
</head>
<body>

    <div class="toolbar">
        <span class="toolbar-title">STATION LTD - Editeur Menus</span>
        <button id="btnToggleEdit" onclick="toggleEditMode()">Mode Edition</button>
        <div class="toolbar-separator"></div>
        <button onclick="exportJSON()">Exporter JSON</button>
        <button onclick="importJSON()">Importer JSON</button>
        <div class="toolbar-separator"></div>
        <button onclick="window.print()">Imprimer</button>
    </div>

    <div class="menu-board" id="menuBoard">
        <div class="inner-board">
            <div class="header">
                <div class="main-title">
                    <img src="img/logo-ltd.png" alt="LTD" class="main-title-logo">
                    <h2>STATION LTD - MENUS & FORMULES</h2>
                </div>
            </div>

            <div class="menus-container" id="menusContainer"></div>

            <div class="footer-section">
                <div class="footer-brand">LTD - Bruxelles</div>
                <div class="footer-slogan">Venez remplir le plein... et plus encore</div>
            </div>

            <nav class="page-nav">
                <a href="index.html">Accueil</a>
                <a href="produits.html">Produits</a>
                <a href="menus.html" class="current">Menus</a>
                <a href="entreprises.html">Entreprises</a>
            </nav>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Exporter les donnees</h3>
            <textarea id="modalTextarea" spellcheck="false"></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Fermer</button>
                <button class="btn-primary" id="modalAction" onclick="copyToClipboard()">Copier</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/menus.js"></script>

</body>
</html>
