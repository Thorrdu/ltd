<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station LTD - Produits (TEST)</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/produits.css">
    <style>
        /* Zone logo dediee sur fond blanc/creme */
        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px 6px;
            background: #fff;
            border-radius: 4px 4px 0 0;
            margin-bottom: 0;
        }

        .logo-area img {
            width: 72px;
            height: auto;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.15));
        }

        /* Le titre rouge perd le border-radius haut puisque le logo est au-dessus */
        .main-title {
            border-radius: 0 0 3px 3px;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <span class="toolbar-title">STATION LTD -- Editeur de Menu (TEST)</span>
        <button id="btnToggleEdit" onclick="toggleEditMode()">Mode Edition</button>
        <div class="toolbar-separator"></div>
        <button onclick="exportJSON()">Exporter JSON</button>
        <button onclick="importJSON()">Importer JSON</button>
        <div class="toolbar-separator"></div>
        <button onclick="window.print()">Imprimer</button>
    </div>

    <div class="menu-board" id="menuBoard">
        <div class="inner-board">
            <div class="header">
                <div class="logo-area">
                    <img src="img/logo-ltd.png" alt="LTD">
                </div>
                <div class="main-title">
                    <h2>STATION LTD - PRODUITS</h2>
                </div>
            </div>

            <div class="categories-grid" id="categoriesGrid"></div>

            <div class="footer-section">
                <div class="footer-brand">LTD - Bruxelles</div>
                <div class="footer-slogan">Venez remplir le plein... et plus encore</div>
            </div>

            <nav class="page-nav">
                <a href="index.html">Accueil</a>
                <a href="produits.html">Produits</a>
                <a href="menus.html">Menus</a>
                <a href="entreprises.html">Entreprises</a>
            </nav>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Exporter les donnees</h3>
            <textarea id="modalTextarea" spellcheck="false"></textarea>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Fermer</button>
                <button class="btn-primary" id="modalAction" onclick="copyToClipboard()">Copier</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/produits.js"></script>

</body>
</html>
